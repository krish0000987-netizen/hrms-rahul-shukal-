<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="rahulGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="rahulGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Modern Icon Symbol -->
  <g transform="translate(6, 10)" filter="url(#shadow)">
    <!-- Hexagon / Diamond Shield Background -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#rahulGrad)" />
    <!-- Stylized R + HR Network Nodes -->
    <path d="M14 36 V14 H25 C29.5 14 33 17 33 21 C33 24.5 30.5 27 27 27.8 L34 36 H28.5 L22.5 28.5 H19 V36 Z M19 24 H24.5 C26.8 24 28.2 22.8 28.2 21 C28.2 19.2 26.8 18 24.5 18 H19 Z" fill="#ffffff" />
    <!-- Dynamic Accent Dot -->
    <circle cx="37" cy="13" r="4.5" fill="url(#rahulGrad2)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <text x="66" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    RAHUL <tspan fill="#2563eb" font-weight="700">HRMS</tspan>
  </text>
  
  <text x="67" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="1.2">
    HUMAN RESOURCE SYSTEM
  </text>
</svg>
